<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with Persistent Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 100%;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Table with Persistent Links</h2>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div class="input-container">
            <input type="text" id="nameInput" placeholder="Enter Name">
            <input type="text" id="linkInput" placeholder="Enter URL (https://example.com)">
            <button onclick="addRow()">Add</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadSavedData);

        function addRow() {
            let name = document.getElementById("nameInput").value.trim();
            let link = document.getElementById("linkInput").value.trim();

            if (name === "" || link === "") return;
            if (!link.startsWith("http://") && !link.startsWith("https://")) {
                alert("Please enter a valid URL starting with http:// or https://");
                return;
            }

            let tableBody = document.getElementById("tableBody");
            let row = document.createElement("tr");

            row.innerHTML = `
                <td>${name}</td>
                <td><a href="${link}" target="_blank">Visit</a></td>
            `;

            tableBody.appendChild(row);
            saveData(name, link);

            document.getElementById("nameInput").value = "";
            document.getElementById("linkInput").value = "";
        }

        function saveData(name, link) {
            let savedData = JSON.parse(localStorage.getItem("tableData")) || [];
            savedData.push({ name, link });
            localStorage.setItem("tableData", JSON.stringify(savedData));
        }

        function loadSavedData() {
            let savedData = JSON.parse(localStorage.getItem("tableData")) || [];

            let tableBody = document.getElementById("tableBody");
            tableBody.innerHTML = ""; // Clear existing table content

            savedData.forEach(entry => {
                let row = document.createElement("tr");
                row.innerHTML = `
                    <td>${entry.name}</td>
                    <td><a href="${entry.link}" target="_blank">Visit</a></td>
                `;
                tableBody.appendChild(row);
            });

            // Add default entries if table is empty
            if (savedData.length === 0) {
                addDefaultEntries();
            }
        }

        function addDefaultEntries() {
            let defaultEntries = [
                { name: "Google", link: "https://www.google.com" },
                { name: "YouTube", link: "https://www.youtube.com" }
            ];

            localStorage.setItem("tableData", JSON.stringify(defaultEntries));
            loadSavedData();
        }
    </script>

</body>
</html>
