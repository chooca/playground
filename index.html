<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Table with Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f2f2;
        }

        .input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            width: 100%;
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Simple Table with Links</h2>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Google</td>
                    <td><a href="https://www.google.com" target="_blank">Visit</a></td>
                </tr>
                <tr>
                    <td>YouTube</td>
                    <td><a href="https://www.youtube.com" target="_blank">Visit</a></td>
                </tr>
            </tbody>
        </table>

        <div class="input-container">
            <input type="text" id="nameInput" placeholder="Enter Name">
            <input type="text" id="linkInput" placeholder="Enter URL (https://example.com)">
            <button onclick="addRow()">Add</button>
        </div>
    </div>

    <script>
        function addRow() {
            let name = document.getElementById("nameInput").value.trim();
            let link = document.getElementById("linkInput").value.trim();

            if (name === "" || link === "") return;
            if (!link.startsWith("http://") && !link.startsWith("https://")) {
                alert("Please enter a valid URL starting with http:// or https://");
                return;
            }

            let table = document.getElementById("dataTable").getElementsByTagName("tbody")[0];
            let row = table.insertRow();
            row.innerHTML = `
                <td>${name}</td>
                <td><a href="${link}" target="_blank">Visit</a></td>
            `;

            document.getElementById("nameInput").value = "";
            document.getElementById("linkInput").value = "";
        }
    </script>

</body>
</html>
