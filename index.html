<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table with Persistent Links (XML)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2>Table with Persistent Links (XML)</h2>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>

        <div class="input-container">
            <input type="text" id="nameInput" placeholder="Enter Name">
            <input type="text" id="linkInput" placeholder="Enter URL (https://example.com)">
            <button onclick="addRow()">Add</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
